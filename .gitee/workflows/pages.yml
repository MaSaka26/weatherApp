name: Gitee Pages Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: weatherApp-VUE3/package-lock.json

      - name: Install
        working-directory: weatherApp-VUE3
        run: npm ci

      - name: Test
        working-directory: weatherApp-VUE3
        run: npm test

      - name: Lint
        working-directory: weatherApp-VUE3
        run: npm run lint

      - name: Build
        working-directory: weatherApp-VUE3
        env:
          VITE_SITE_BASE: ./
        run: npm run build

      - name: Add 404 fallback
        run: cp weatherApp-VUE3/dist/index.html weatherApp-VUE3/dist/404.html

      - name: Deploy to Gitee Pages
        uses: yanglbme/gitee-pages-action@main
        with:
          gitee-repo: masaka0426/weather-app
          gitee-branch: master
          gitee-pages-branch: gh-pages
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          directory: weatherApp-VUE3/dist
