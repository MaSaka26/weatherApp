<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天气</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0b0e1a;
    color: #f0f4ff;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Animated Background ===== */
  .sky-bg {
    position: fixed; inset: 0;
    z-index: 0;
    background: linear-gradient(170deg, #0b0e1a 0%, #141b33 30%, #1a2a4a 55%, #2a3f5e 80%, #3d5a7a 100%);
    transition: background 1.2s ease;
  }
  .sky-bg::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(100, 160, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(180, 120, 255, 0.06) 0%, transparent 50%);
  }
  .sky-bg::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
                radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1px 1px at 50% 40%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,0.15), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(255,255,255,0.2), transparent);
    background-size: 200px 200px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* ===== Weather-adaptive backgrounds ===== */
  .sky-bg.clear-day { background: linear-gradient(170deg, #0f1b3a 0%, #1e3a6e 25%, #3b7bc8 55%, #6db3f2 80%, #a8d8ff 100%); }
  .sky-bg.clear-night { background: linear-gradient(170deg, #050812 0%, #0a1028 30%, #141f45 55%, #1a2a5a 80%, #2a3f6a 100%); }
  .sky-bg.cloudy { background: linear-gradient(170deg, #1a1e2e 0%, #2a3045 30%, #3d4560 55%, #5a6075 80%, #707588 100%); }
  .sky-bg.rainy { background: linear-gradient(170deg, #0f121f 0%, #1a1f35 30%, #2a3050 55%, #3a4060 80%, #4a5070 100%); }
  .sky-bg.snowy { background: linear-gradient(170deg, #1a1e30 0%, #2a3048 30%, #4a5070 55%, #6a7088 80%, #8a8fa0 100%); }
  .sky-bg.thunderstorm { background: linear-gradient(170deg, #050510 0%, #0f0f20 30%, #1a1a35 55%, #252045 80%, #302850 100%); }

  /* ===== Layout ===== */
  .app-container {
    position: relative; z-index: 1;
    max-width: 500px; margin: 0 auto;
    padding: 0 20px 40px;
    min-height: 100vh; min-height: 100dvh;
  }

  /* ===== Search Bar ===== */
  .search-section {
    padding: 20px 0 10px;
    position: relative;
  }
  .search-wrapper {
    position: relative;
    display: flex; align-items: center;
  }
  .search-wrapper .search-icon {
    position: absolute; left: 16px;
    font-size: 18px; opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .search-wrapper:focus-within .search-icon { opacity: 0.8; }
  .search-input {
    width: 100%;
    padding: 14px 16px 14px 46px;
    border: none; border-radius: 14px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.3px;
    outline: none;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.35); font-weight: 300; }
  .search-input:focus {
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
  }
  .search-clear {
    position: absolute; right: 14px;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .search-clear:hover { background: rgba(255,255,255,0.25); }
  .search-clear.visible { display: flex; }

  /* ===== Loading ===== */
  .loading-spinner {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 0;
    gap: 20px;
  }
  .loading-spinner.active { display: flex; }
  .spinner-ring {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: rgba(255,255,255,0.7);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-spinner span { font-size: 15px; color: rgba(255,255,255,0.5); font-weight: 300; }

  /* ===== Error State ===== */
  .error-message {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 60px 20px;
    text-align: center;
  }
  .error-message.active { display: flex; }
  .error-message .error-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255, 100, 100, 0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .error-message .error-title { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.8); }
  .error-message .error-desc { font-size: 14px; color: rgba(255,255,255,0.45); font-weight: 300; line-height: 1.5; }
  .error-message .error-retry {
    margin-top: 8px;
    padding: 10px 28px;
    border: none; border-radius: 20px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .error-message .error-retry:hover { background: rgba(255,255,255,0.2); }

  /* ===== Weather Content ===== */
  .weather-content { display: none; animation: fadeUp 0.7s ease; }
  .weather-content.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Current Weather ===== */
  .current-weather {
    text-align: center;
    padding: 20px 0 10px;
  }
  .current-city {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.9);
    margin-bottom: 4px;
    animation: fadeUp 0.6s ease both;
  }
  .current-temp {
    font-size: 82px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -2px;
    animation: fadeUp 0.6s 0.1s ease both;
  }
  .current-temp .deg-symbol {
    font-size: 36px;
    font-weight: 200;
    vertical-align: super;
  }
  .current-condition {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
    animation: fadeUp 0.6s 0.2s ease both;
  }
  .current-highlow {
    font-size: 17px;
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
    animation: fadeUp 0.6s 0.25s ease both;
  }
  .current-highlow span { margin: 0 6px; }
  .current-highlow .high { color: rgba(255,255,255,0.8); }
  .current-highlow .low { color: rgba(255,255,255,0.4); }

  /* ===== Details Grid ===== */
  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 20px 0 24px;
    animation: fadeUp 0.6s 0.3s ease both;
  }
  .detail-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.04);
    transition: background 0.3s;
  }
  .detail-card:hover { background: rgba(255,255,255,0.09); }
  .detail-card .label {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .detail-card .value {
    font-size: 20px;
    font-weight: 300;
    color: rgba(255,255,255,0.9);
  }
  .detail-card .value .unit {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    font-weight: 300;
  }

  /* ===== Hourly Forecast ===== */
  .hourly-section {
    margin: 20px 0 24px;
    animation: fadeUp 0.6s 0.35s ease both;
  }
  .section-title {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .hourly-scroll {
    display: flex;
    gap: 0;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 4px 0;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .hourly-scroll::-webkit-scrollbar { display: none; }
  .hourly-item {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    min-width: 72px;
    transition: background 0.2s;
    border-radius: 12px;
  }
  .hourly-item:hover { background: rgba(255,255,255,0.05); }
  .hourly-item .hour-time {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
  }
  .hourly-item .hour-icon { font-size: 22px; line-height: 1; }
  .hourly-item .hour-temp {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
  }
  .hourly-item.now .hour-time { color: #6db3f2; font-weight: 600; }
  .hourly-item.now .hour-temp { color: #6db3f2; font-weight: 500; }

  /* ===== Daily Forecast ===== */
  .daily-section {
    margin: 20px 0 30px;
    animation: fadeUp 0.6s 0.4s ease both;
  }
  .daily-list {
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }
  .daily-item {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
  }
  .daily-item:last-child { border-bottom: none; }
  .daily-item:hover { background: rgba(255,255,255,0.03); }
  .daily-item .day-name {
    flex: 0 0 72px;
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,0.8);
  }
  .daily-item .day-name.today { font-weight: 600; color: #6db3f2; }
  .daily-item .day-icon { flex: 0 0 32px; text-align: center; font-size: 20px; }
  .daily-item .day-precip {
    flex: 0 0 40px;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-align: center;
  }
  .daily-item .day-temps {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    font-weight: 400;
  }
  .daily-item .day-temps .high { color: rgba(255,255,255,0.85); min-width: 36px; text-align: right; }
  .daily-item .day-temps .low { color: rgba(255,255,255,0.35); min-width: 36px; text-align: right; }
  .daily-item .temp-bar-wrap {
    width: 60px; height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .daily-item .temp-bar-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, rgba(100,180,255,0.6), rgba(255,200,100,0.6));
    transition: width 0.6s ease;
  }

  /* ===== Location Hint ===== */
  .location-hint {
    text-align: center;
    padding: 10px 0;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.5px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .app-container { padding: 0 16px 30px; }
    .current-temp { font-size: 68px; }
    .current-temp .deg-symbol { font-size: 30px; }
    .current-city { font-size: 24px; }
    .details-grid { gap: 8px; }
    .detail-card { padding: 12px 8px; }
    .detail-card .value { font-size: 17px; }
    .hourly-item { padding: 12px 12px; min-width: 64px; }
    .daily-item { padding: 12px 14px; }
    .daily-item .temp-bar-wrap { width: 44px; }
  }

  @media (min-width: 768px) {
    .app-container { padding: 20px 20px 50px; }
    .current-temp { font-size: 96px; }
    .details-grid { gap: 14px; }
    .hourly-item { padding: 16px 20px; min-width: 80px; }
    .daily-item .temp-bar-wrap { width: 80px; }
  }

  /* ===== Refresh Button ===== */
  .refresh-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
  .refresh-btn:active { transform: scale(0.92); }
  .refresh-btn.refreshing { animation: btnSpin 0.8s linear infinite; }
  @keyframes btnSpin { to { transform: rotate(360deg); } }
</style>

<script>
/* ============================================================
   Weather App — Open-Meteo API
   ============================================================ */

// ─── State ─────────────────────────────────────────────────
const state = {
  lat: null,
  lon: null,
  cityName: null,
  isSearching: false,
};

// ─── DOM refs ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
const searchInput = $('searchInput');
const clearBtn = $('clearBtn');
const loadingSpinner = $('loadingSpinner');
const errorMessage = $('errorMessage');
const errorTitle = $('errorTitle');
const errorDesc = $('errorDesc');
const retryBtn = $('retryBtn');
const weatherContent = $('weatherContent');
const cityName = $('cityName');
const currentTemp = $('currentTemp');
const conditionText = $('conditionText');
const highTemp = $('highTemp');
const lowTemp = $('lowTemp');
const feelsLike = $('feelsLike');
const windSpeed = $('windSpeed');
const humidity = $('humidity');
const hourlyScroll = $('hourlyScroll');
const dailyList = $('dailyList');
const skyBg = $('skyBg');
const refreshBtn = $('refreshBtn');
const locationHint = $('locationHint');

// ─── Weather Icons Map ─────────────────────────────────────
function getWeatherIcon(code, isDay = true) {
  if (code === 0) return isDay ? '☀️' : '🌙';
  if (code === 1) return isDay ? '🌤️' : '🌙';
  if (code === 2) return isDay ? '⛅' : '☁️';
  if (code === 3) return '☁️';
  if (code >= 45 && code <= 48) return '🌫️';
  if (code >= 51 && code <= 55) return '🌦️';
  if (code >= 56 && code <= 57) return '🌨️';
  if (code >= 61 && code <= 65) return '🌧️';
  if (code >= 66 && code <= 67) return '🌧️';
  if (code >= 71 && code <= 77) return '❄️';
  if (code >= 80 && code <= 82) return '🌦️';
  if (code >= 85 && code <= 86) return '🌨️';
  if (code >= 95) return '⛈️';
  return '🌤️';
}

function getConditionText(code) {
  const map = {
    0: '晴朗', 1: '大部晴朗', 2: '多云', 3: '阴天',
    45: '雾', 48: '霜雾',
    51: '小毛毛雨', 53: '毛毛雨', 55: '大毛毛雨',
    56: '冻毛毛雨', 57: '冻毛毛雨',
    61: '小雨', 63: '中雨', 65: '大雨',
    66: '冻雨', 67: '冻雨',
    71: '小雪', 73: '中雪', 75: '大雪',
    77: '雪粒',
    80: '阵雨', 81: '中阵雨', 82: '大阵雨',
    85: '小阵雪', 86: '大阵雪',
    95: '雷暴', 96: '雷暴加冰雹', 99: '雷暴加冰雹',
  };
  return map[code] || '未知';
}

function getSkyClass(code, isDay) {
  if (code === 0) return isDay ? 'clear-day' : 'clear-night';
  if (code <= 2) return isDay ? 'clear-day' : 'clear-night';
  if (code === 3 || (code >= 45 && code <= 48)) return 'cloudy';
  if (code >= 51 && code <= 67) return 'rainy';
  if (code >= 71 && code <= 77) return 'snowy';
  if (code >= 80 && code <= 82) return 'rainy';
  if (code >= 85 && code <= 86) return 'snowy';
  if (code >= 95) return 'thunderstorm';
  return 'clear-day';
}

// ─── API Calls ─────────────────────────────────────────────
const GEO_API = 'https://geocoding-api.open-meteo.com/v1/search';
const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

async function geocodeCity(city) {
  const url = `${GEO_API}?name=${encodeURIComponent(city)}&count=5&language=zh&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Geocoding API 请求失败');
  const data = await res.json();
  if (!data.results || data.results.length === 0) throw new Error('CITY_NOT_FOUND');
  const r = data.results[0];
  return { lat: r.latitude, lon: r.longitude, name: r.name, country: r.country || '' };
}

async function fetchWeather(lat, lon) {
  const url = `${WEATHER_API}?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=auto&forecast_days=16`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Forecast API 请求失败');
  return res.json();
}

// ─── Render ────────────────────────────────────────────────
function renderWeather(data, cityLabel) {
  const c = data.current;
  const d = data.daily;
  const h = data.hourly;

  // Header
  cityName.textContent = cityLabel;
  currentTemp.innerHTML = `${Math.round(c.temperature_2m)}<span class="deg-symbol">°</span>`;
  conditionText.textContent = getConditionText(c.weather_code);
  highTemp.textContent = `H: ${Math.round(d.temperature_2m_max[0])}°`;
  lowTemp.textContent = `L: ${Math.round(d.temperature_2m_min[0])}°`;

  // Details
  feelsLike.innerHTML = `${Math.round(c.apparent_temperature)}<span class="unit">°</span>`;
  windSpeed.innerHTML = `${Math.round(c.wind_speed_10m)}<span class="unit"> km/h</span>`;
  humidity.innerHTML = `${c.relative_humidity_2m}<span class="unit">%</span>`;

  // Sky background
  const isDay = nowIsDay();
  const skyClass = getSkyClass(c.weather_code, isDay);
  skyBg.className = 'sky-bg ' + skyClass;

  // Hourly
  renderHourly(h, data);

  // Daily
  renderDaily(d);

  // Hint
  locationHint.textContent = `数据来源: Open-Meteo · ${new Date().toLocaleString('zh-CN')}`;

  weatherContent.classList.add('active');
  weatherContent.style.animation = 'none';
  requestAnimationFrame(() => {
    weatherContent.style.animation = '';
  });
}

function renderHourly(hourly, data) {
  const now = new Date();
  const currentHour = now.getHours();
  const timeArr = hourly.time;
  const tempArr = hourly.temperature_2m;
  const codeArr = hourly.weather_code;
  const precipArr = hourly.precipitation_probability;

  // Find start index = current hour or next hour
  let startIdx = -1;
  for (let i = 0; i < timeArr.length; i++) {
    const t = new Date(timeArr[i].replace(' ', 'T'));
    const h = t.getHours();
    if (h >= currentHour) { startIdx = i; break; }
  }
  if (startIdx === -1) startIdx = 0;

  let html = '';
  for (let i = startIdx; i < Math.min(startIdx + 24, timeArr.length); i++) {
    // timezone=auto 返回的是本地时间字符串，直接按本地解析
    const t = new Date(timeArr[i].replace(' ', 'T'));
    const hour = t.getHours();
    const hourLabel = hour === currentHour ? '现在' : `${String(hour).padStart(2, '0')}:00`;
    const isNow = hour === currentHour;
    const isHourDay = hour >= 6 && hour < 19;
    const icon = getWeatherIcon(codeArr[i], isHourDay);
    const temp = Math.round(tempArr[i]);
    html += `<div class="hourly-item${isNow ? ' now' : ''}">
      <span class="hour-time">${hourLabel}</span>
      <span class="hour-icon">${icon}</span>
      <span class="hour-temp">${temp}°</span>
    </div>`;
  }
  hourlyScroll.innerHTML = html;

  // Auto-scroll to "现在"
  requestAnimationFrame(() => {
    const nowEl = hourlyScroll.querySelector('.now');
    if (nowEl) {
      nowEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
}

function renderDaily(daily) {
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  let html = '';
  for (let i = 0; i < daily.time.length; i++) {
    const date = new Date(daily.time[i] + 'T00:00:00');
    const dayName = daily.time[i] === todayStr ? '今天' : days[date.getDay()];
    const icon = getWeatherIcon(daily.weather_code[i], true);
    const high = Math.round(daily.temperature_2m_max[i]);
    const low = Math.round(daily.temperature_2m_min[i]);
    const precip = daily.precipitation_probability_max[i] || 0;

    // Temp bar
    const allHighs = daily.temperature_2m_max;
    const allLows = daily.temperature_2m_min;
    const globalMin = Math.min(...allLows);
    const globalMax = Math.max(...allHighs);
    const range = globalMax - globalMin || 1;
    const barLeft = ((low - globalMin) / range) * 100;
    const barWidth = ((high - low) / range) * 100;

    html += `<div class="daily-item">
      <span class="day-name${daily.time[i] === todayStr ? ' today' : ''}">${dayName}</span>
      <span class="day-icon">${icon}</span>
      <span class="day-precip">${precip > 0 ? precip + '%' : ''}</span>
      <div class="day-temps">
        <span class="low">${low}°</span>
        <div class="temp-bar-wrap"><div class="temp-bar-fill" style="left:${barLeft}%;width:${Math.max(barWidth, 4)}%"></div></div>
        <span class="high">${high}°</span>
      </div>
    </div>`;
  }
  dailyList.innerHTML = html;
}

// ─── Refresh ───────────────────────────────────────────────
async function refreshWeather() {
  if (!state.lat || !state.lon) return;
  showLoading();
  try {
    const data = await fetchWeather(state.lat, state.lon);
    renderWeather(data, state.cityName);
    hideAllOverlays();
    weatherContent.classList.add('active');
  } catch (err) {
    showError('数据加载失败', err.message + '。请下拉刷新重试。');
  }
}

// ─── Load City ─────────────────────────────────────────────
async function loadCity(city) {
  state.isSearching = true;
  showLoading();
  hideAllOverlays();
  try {
    const geo = await geocodeCity(city);
    state.lat = geo.lat;
    state.lon = geo.lon;
    state.cityName = geo.name;
    const data = await fetchWeather(geo.lat, geo.lon);
    renderWeather(data, geo.name);
    hideAllOverlays();
    weatherContent.classList.add('active');
  } catch (err) {
    weatherContent.classList.remove('active');
    if (err.message === 'CITY_NOT_FOUND') {
      showError('未找到城市', `未找到「${city}」，请检查城市名称是否正确。`);
    } else {
      showError('加载失败', err.message);
    }
  } finally {
    state.isSearching = false;
  }
}

// ─── Geolocation ───────────────────────────────────────────
async function loadByGeolocation() {
  showLoading();
  hideAllOverlays();
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: false, timeout: 8000, maximumAge: 60000,
      });
    });
    state.lat = pos.coords.latitude;
    state.lon = pos.coords.longitude;
    state.cityName = '当前位置';
    const data = await fetchWeather(state.lat, state.lon);
    // Open-Meteo 不支持真正反向地理编码，这里尝试用坐标就近估算城市名
    try {
      const nearest = await suggestNearestCity(state.lat, state.lon);
      if (nearest) state.cityName = nearest;
    } catch {
      // 保持 "当前位置"
    }
    renderWeather(data, state.cityName);
    hideAllOverlays();
    weatherContent.classList.add('active');
  } catch (err) {
    weatherContent.classList.remove('active');
    if (err.code === 1) {
      showError('定位已关闭', '请在浏览器设置中允许定位，或手动搜索城市名称。');
    } else if (err.code === 2) {
      showError('定位失败', '无法获取位置信息，请手动搜索城市。');
    } else {
      showError('定位超时', '定位请求超时，请手动搜索城市。');
    }
  }
}

// ─── UI Helpers ────────────────────────────────────────────
function showLoading() {
  loadingSpinner.classList.add('active');
  errorMessage.classList.remove('active');
  weatherContent.classList.remove('active');
}
function hideAllOverlays() {
  loadingSpinner.classList.remove('active');
  errorMessage.classList.remove('active');
}
function showError(title, desc) {
  loadingSpinner.classList.remove('active');
  weatherContent.classList.remove('active');
  errorTitle.textContent = title;
  errorDesc.textContent = desc;
  errorMessage.classList.add('active');
}

// ─── 就近城市估算（Open-Meteo 无反向地理编码，用内置城市表找最近点）──
const MAJOR_CITIES = [
  { name: '北京', lat: 39.90, lon: 116.41 },
  { name: '上海', lat: 31.23, lon: 121.47 },
  { name: '广州', lat: 23.13, lon: 113.26 },
  { name: '深圳', lat: 22.55, lon: 114.06 },
  { name: '成都', lat: 30.57, lon: 104.07 },
  { name: '杭州', lat: 30.27, lon: 120.16 },
  { name: '武汉', lat: 30.59, lon: 114.31 },
  { name: '西安', lat: 34.34, lon: 108.94 },
  { name: '南京', lat: 32.06, lon: 118.80 },
  { name: '重庆', lat: 29.56, lon: 106.55 },
  { name: '天津', lat: 39.09, lon: 117.20 },
  { name: '苏州', lat: 31.30, lon: 120.58 },
  { name: '郑州', lat: 34.75, lon: 113.63 },
  { name: '长沙', lat: 28.23, lon: 112.94 },
  { name: '沈阳', lat: 41.81, lon: 123.43 },
  { name: '青岛', lat: 36.07, lon: 120.38 },
  { name: '大连', lat: 38.91, lon: 121.61 },
  { name: '厦门', lat: 24.48, lon: 118.09 },
  { name: '昆明', lat: 25.04, lon: 102.71 },
  { name: '哈尔滨', lat: 45.80, lon: 126.53 },
  { name: '乌鲁木齐', lat: 43.83, lon: 87.62 },
  { name: '拉萨', lat: 29.65, lon: 91.14 },
];

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function suggestNearestCity(lat, lon) {
  let best = null, bestDist = Infinity;
  for (const c of MAJOR_CITIES) {
    const dist = haversineKm(lat, lon, c.lat, c.lon);
    if (dist < bestDist) { bestDist = dist; best = c; }
  }
  // 仅当在 150km 内才用城市名，否则显示坐标
  if (best && bestDist <= 150) return best.name;
  return `${lat.toFixed(1)}°N, ${lon.toFixed(1)}°E`;
}

// ─── Debounce ──────────────────────────────────────────────
function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// 简单判断当前是否为白天（6:00 - 18:59 视为白天）
function nowIsDay() {
  const h = new Date().getHours();
  return h >= 6 && h < 19;
}

// ─── Events ────────────────────────────────────────────────
const debouncedSearch = debounce((value) => {
  const trimmed = value.trim();
  if (trimmed.length >= 2) {
    loadCity(trimmed);
  }
}, 600);

searchInput.addEventListener('input', (e) => {
  clearBtn.classList.toggle('visible', e.target.value.length > 0);
  debouncedSearch(e.target.value);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = searchInput.value.trim();
    if (val.length >= 2) {
      loadCity(val);
    }
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  searchInput.focus();
});

retryBtn.addEventListener('click', () => {
  if (state.lat && state.lon) {
    refreshWeather();
  } else {
    loadByGeolocation();
  }
});

refreshBtn.addEventListener('click', () => {
  refreshBtn.classList.add('refreshing');
  refreshWeather().finally(() => {
    setTimeout(() => refreshBtn.classList.remove('refreshing'), 600);
  });
});

// ─── Init ──────────────────────────────────────────────────
loadByGeolocation();
</script>
