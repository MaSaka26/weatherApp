name: Deploy

# 打 v* tag（或手动触发）时：跑质量门 → 构建 → 把 dist 推到 gh-pages → 自动建 Release。
# 不再需要本地手动构建、手动推 gh-pages。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 发布 job 需要写 contents（推 gh-pages）与写 release。
permissions:
  contents: write

# 同一时间只允许一个发布任务，避免 tag 连打时两次部署互相覆盖。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史：vite.config.js 用 git describe 注入版本号到页面与 deploy.json。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: weatherApp-VUE3/package-lock.json
      - run: npm ci
        working-directory: weatherApp-VUE3
      - run: npm test
        working-directory: weatherApp-VUE3
      - run: npm run lint
        working-directory: weatherApp-VUE3
      - run: npm run build
        working-directory: weatherApp-VUE3
        env:
          VITE_SITE_BASE: ./
      - name: Show build identity
        run: cat weatherApp-VUE3/dist/deploy.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: weatherApp-VUE3/dist
          retention-days: 7
          # dist 里的 .nojekyll 是隐藏文件，upload-artifact v4 默认会漏掉它；
          # 少了它 GitHub Pages 会走 Jekyll 处理，产物可能被改写。
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 用产物分支自身做工作区，避免把源码历史带进 gh-pages。
          ref: gh-pages
          path: pages-branch
        continue-on-error: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Replace gh-pages content with dist
        run: |
          set -euo pipefail
          cd pages-branch
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../dist/. .
          ls -a | head -20
      - name: Commit and push
        working-directory: pages-branch
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          git config user.name "weather-app deploy"
          git config user.email "deploy@local"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to deploy"
            exit 0
          fi
          git commit -q -m "deploy: ${GITHUB_REF_NAME} (${short})"
          git push origin HEAD:gh-pages
          echo "deployed ${GITHUB_REF_NAME} (${short}) to gh-pages"

  release:
    needs: build
    # 只有推 tag 才建 Release；workflow_dispatch 手动重跑时跳过。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists, skip"
            exit 0
          fi

          # 优先用根 README 的「## 更新日志」小节做发布说明：那里是按版本手写的
          # 新增 / 修复 / 工程三段，比 compare 链接可读。找不到该版本时退回 --generate-notes。
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$tag" '
            { sub(/\r$/, "") }
            $1 == "###" && $2 == ver { found = 1; next }
            found && ($1 == "###" || $0 == "---") { exit }
            found {
              if (match($0, /^\*\*(.+)\*\*$/)) {
                heading = substr($0, RSTART + 2, RLENGTH - 4)
                print "### " heading
              } else {
                print
              }
            }
          ' README.md | sed -e '/./,$!d' > "$notes_file"

          if [ -s "$notes_file" ]; then
            printf '%s\n' "" "### 在线预览" "- https://masaka26.github.io/weatherApp/" >> "$notes_file"
            echo "--- release notes ---"
            cat "$notes_file"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes-file "$notes_file" --verify-tag
          else
            echo "no changelog entry for $tag in README.md, fall back to generate-notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes --verify-tag
          fi
