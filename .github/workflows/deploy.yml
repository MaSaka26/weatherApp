name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: weatherApp-VUE3/package-lock.json
      - run: npm ci
        working-directory: weatherApp-VUE3
      - run: npm test
        working-directory: weatherApp-VUE3
      - run: npm run lint
        working-directory: weatherApp-VUE3
      - run: npm run build
        working-directory: weatherApp-VUE3
        env:
          VITE_SITE_BASE: ./
      - name: Push dist to Gitee gh-pages
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USERNAME" ]; then
            echo "skip: GITEE_USERNAME / GITEE_TOKEN not configured"
            exit 0
          fi
          PAGES_DIR="$(mktemp -d)"
          cp -R weatherApp-VUE3/dist/. "$PAGES_DIR"/
          cd "$PAGES_DIR"
          git init -q
          git checkout -b gh-pages
          git -c user.name="weather-app deploy" -c user.email="deploy@local" add -A
          git -c user.name="weather-app deploy" -c user.email="deploy@local" \
            commit -q -m "deploy: ${GITHUB_SHA::7}"
          git remote add origin "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/masaka0426/weather-app.git"
          git push -f origin gh-pages
          echo "Deployed ${GITHUB_SHA::7} to Gitee gh-pages"
